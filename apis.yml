aid: creditas
name: Creditas
description: 'Creditas is a Brazilian digital lending fintech founded in 2012 and
  headquartered in Sao Paulo, operating in Brazil and Mexico. It provides secured
  consumer credit - loans backed by real estate (home equity) and vehicles, plus
  private payroll (consignado privado) loans - alongside auto insurance, multi-bank
  real estate and vehicle financing, and a corporate benefits platform (salary
  advance, flexible-benefits cards, and financial education). Regulated by the Banco
  Central do Brasil, Creditas has originated over R$12 billion in credit. It is
  backed by QED Investors and the SoftBank Vision Fund. No public developer API
  program or OpenAPI has been identified; this profile captures the company public
  identity, its published llms.txt, and its domain security posture.'
